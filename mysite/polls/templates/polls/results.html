<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ question.question_text }} - Results</title>
</head>
<body>

<h1>{{ question.question_text }}</h1>

<ul>
{% for choice in question.choice_set.all %}
    <li>{{ choice.choice_text }} -- {{ choice.votes }} vote{{ choice.votes|pluralize }}<progress id="file" value="{{ choice.votes }}" max="{{ question.top_choice_votes }}"></progress></li>
{% endfor %}
</ul>

<a href="{% url 'polls:detail' question.id %}">Vote again?</a>

</body>
</html>
